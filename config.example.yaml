# MerAlarm 설정
#
# 이 파일을 고친 뒤에는 프로그램을 다시 시작해야 반영됩니다.
# 텔레그램에서 /set 명령으로 바꾸면 재시작 없이 바로 반영됩니다.

poll:
  # 키워드에 interval_sec 을 따로 주지 않으면 이 값을 씁니다.
  # 너무 짧게 잡아도 얻는 게 없습니다. 한 페이지에 120건이 담기므로
  # 그 안에 신규가 다 들어오기만 하면 놓치지 않습니다.
  default_interval_sec: 60
  # 고정 주기는 봇 신호가 되므로 매 회차 ±20% 를 섞습니다.
  jitter_ratio: 0.2
  # 키워드가 몇 개든 전체 요청 사이에 이만큼은 벌립니다.
  min_request_gap_sec: 3
  # 출품이 뜸한 시간대에는 주기를 늘려 하루 요청량을 줄입니다.
  night_mode:
    enabled: true
    start: "02:00"
    end: "07:00"
    interval_sec: 180

store:
  # 이만큼 보이지 않은 상품 기록은 지웁니다. 팔렸거나 내려간 상품이라 다시 안 나옵니다.
  # 반드시 max_age_days 보다 커야 합니다. (실행할 때 검사합니다)
  keep_days: 60

backoff:
  # 연속 실패가 이만큼 쌓이면 경고 알림을 보냅니다.
  fail_threshold: 3
  # 차단(429/403)이 감지되면 주기를 2배씩 늘리되 여기까지만.
  max_interval_sec: 900
  # 연속 성공이 이만큼 쌓이면 주기를 한 단계 되돌립니다.
  recover_after: 5

notify:
  show_krw: true
  # 기존 상품의 가격이 내려가면 알립니다.
  price_drop: true
  # 한 회차 신규가 이 수 이상이면 개별 전송 대신 묶음 요약 1건으로 보냅니다.
  batch_threshold: 5
  # 매일 이 시각에 정상 동작 보고를 보냅니다. null 이면 보내지 않습니다.
  heartbeat_hour: 9
  error_alert: true
  # 출품한 지 이만큼 지난 상품은 알리지 않습니다. null 이면 제한 없음.
  #
  # 메루카리 검색은 "최근 갱신 순"이라 오래된 상품도 순위가 출렁이며 상위로
  # 떠오릅니다. 그러면 처음 보는 상품이라 신규로 잡힙니다. 이 값이 없으면
  # 몇 년 전 상품이 계속 신규 알림으로 올라옵니다.
  max_age_days: 30
  # 출품 후 이만큼 지나서 갱신된 상품(끌어올린 것)은 신규로 알리지 않습니다.
  # null 이면 제한 없음. 0 이면 출품 당일에 갱신된 것까지만 새 매물로 칩니다.
  #
  # max_age_days 와는 다른 질문입니다. 5일 전에 올려두고 그대로인 물건은
  # age 5 · bump 0(늦게 발견한 새 매물), 5일 전에 올리고 오늘 끌어올린 물건은
  # age 5 · bump 5(이미 있던 물건)입니다.
  max_bump_days: 0

# 모든 키워드에 함께 적용되는 제외어입니다.
# 키워드별 exclude 를 덮어쓰지 않고 거기에 더해집니다.
# 제목에 이 말이 들어 있으면 어느 키워드로 잡혔든 알리지 않습니다.
#
# 봇에게 /exclude add 단어 라고 보내면 여기에 적힙니다.
# 넣기 전에 지금 추적 중인 상품 몇 건이 걸리는지 먼저 알려줍니다.
exclude: []

# 검색어가 짧으면 그 말이 다른 낱말 속에 박혀서도 걸립니다. 메루카리 검색은
# 제목만 보지 않고 설명문까지 뒤지기 때문입니다. 그럴 때는 키워드에 require 를
# 붙여 "제목에 이 중 하나는 있어야 한다"고 정하면 됩니다.
#
#   require: [シャニマス, アイドルマスター]
#
# 봇에게 /require 번호 add 단어 라고 보내면 여기에 적힙니다.
#
# 키워드는 문자열 한 줄로 간단히 쓰거나, 조건을 붙여 상세히 쓸 수 있습니다.
# 봇에게 /add 명령으로 추가하는 편이 더 쉽습니다.
#
#   conditions      1 새상품·미사용  2 거의 새것  3 눈에 띄는 상처 없음
#                   4 약간 상처·오염  5 상처·오염  6 상태 나쁨
#   shipping_payers 1 구매자 부담  2 판매자 부담  3 미정
#                   ※ 메루카리 Shops(사업자 판매) 상품은 이 값이 비어 있어서
#                     shipping_payers 를 지정하면 Shops 상품이 전부 제외됩니다.
#
# 비워두면 해당 조건으로는 거르지 않습니다.
keywords:
  - name: 예시 키워드
    query: ポケモンカード
    exclude:
      - まとめ
      - セット
