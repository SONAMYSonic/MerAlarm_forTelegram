# MerAlarm 설정

poll:
  # 키워드에 interval_sec 을 따로 주지 않으면 이 값을 쓴다.
  default_interval_sec: 30
  # 고정 주기는 봇 시그니처가 되므로 매 회차 ±20% 를 섞는다.
  jitter_ratio: 0.2
  # 키워드가 몇 개든 전체 요청 사이에 이만큼은 벌린다.
  min_request_gap_sec: 3
  # 출품이 뜸한 시간대에는 주기를 늘려 하루 요청량을 줄인다.
  night_mode:
    enabled: false
    start: "02:00"
    end: "07:00"
    interval_sec: 180

store:
  # 이만큼 보이지 않은 상품 기록은 지운다. 팔렸거나 내려간 상품이라 다시 안 나온다.
  # 아직 팔리지 않은 상품은 매 회차 갱신되므로 지워지지 않는다.
  #
  # 반드시 max_age_days 보다 커야 한다. 그보다 짧으면 아직 감시 중인 상품의 기록이
  # 지워져 이미 알린 상품을 신규로 다시 알린다. (실행할 때 검사한다)
  keep_days: 60

backoff:
  # 연속 실패가 이만큼 쌓이면 경고 알림을 보낸다.
  fail_threshold: 3
  # 차단(429/403)이 감지되면 주기를 2배씩 늘리되 여기까지만.
  max_interval_sec: 900
  # 연속 성공이 이만큼 쌓이면 주기를 한 단계 되돌린다.
  recover_after: 5

notify:
  show_krw: true
  # 기존 상품의 가격이 내려가면 알린다.
  price_drop: true
  # 출품한 지 이만큼 지난 상품은 알리지 않는다. null 이면 제한 없음.
  #
  # 메루카리 검색은 "최근 갱신 순"이라 오래된 상품도 순위가 출렁이며 상위로
  # 떠오른다. 그러면 우리 눈에는 처음 보는 상품이라 신규로 잡힌다. 실제로
  # 상위 120건 중 15%가 출품 3개월이 지난 것들이다(가장 오래된 것은 680일).
  # 이 값을 두지 않으면 몇 년 전 상품이 신규 알림으로 계속 올라온다.
  max_age_days: 30
  # 한 회차 신규가 이 수 이상이면 개별 전송 대신 묶음 요약 1건으로 보낸다.
  batch_threshold: 5
  # 매일 이 시각에 정상 동작 보고를 보낸다. null 이면 보내지 않는다.
  heartbeat_hour: 9
  error_alert: true

# 키워드는 문자열 한 줄로 간단히 쓰거나, 조건을 붙여 상세히 쓸 수 있다.
#
#   conditions      1 새상품·미사용  2 거의 새것  3 눈에 띄는 상처 없음
#                   4 약간 상처·오염  5 상처·오염  6 상태 나쁨
#   shipping_payers 1 구매자 부담  2 판매자 부담  3 미정
#                   ※ 메루카리 Shops(사업자 판매) 상품은 이 값이 비어 있어서
#                     shipping_payers 를 지정하면 Shops 상품이 전부 제외된다.
#
# 비워두면 해당 조건으로는 거르지 않는다.
keywords:
  - name: 和泉愛依
    query: 和泉愛依

  - name: 黛冬優子
    query: 黛冬優子

  - name: 芹沢あさひ
    query: 芹沢あさひ
    exclude:
      - 
